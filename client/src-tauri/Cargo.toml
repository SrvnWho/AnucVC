[package]
name = "anucvc"
version = "1.0.0"
description = "Lightweight desktop client for AnucVC"
authors = ["AnucVC Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = [ "shell-open", "notification-all", "updater", "window-set-title", "window-set-icon", "window-set-focus", "window-request-user-attention", "window-unminimize", "icon-png", "system-tray" ] }
tauri-plugin-single-instance = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
