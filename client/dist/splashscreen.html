<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>AnucVC</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #1a1b1e;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  .splash {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    gap: 22px;
  }

  .logo {
    width: 84px;
    height: 84px;
    border-radius: 22px;
    background: #5865f2;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 44px;
    font-weight: 800;
    color: #fff;
    box-shadow: 0 8px 28px rgba(88, 101, 242, 0.45);
  }

  .spinner {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.15);
    border-top-color: #5865f2;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .status-text {
    font-size: 13px;
    color: #94a3b8;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="splash">
    <div class="logo">A</div>
    <div class="spinner"></div>
    <div class="status-text" id="status-text">Güncellemeler kontrol ediliyor...</div>
  </div>
  <script>
    // Purely cosmetic progression - the real update check (Tauri's native
    // updater) runs independently in the background regardless of what this
    // screen says. main.rs closes this window and shows the main one after a
    // short minimum display time, not based on this text.
    setTimeout(() => {
      const el = document.getElementById('status-text');
      if (el) el.textContent = 'AnucVC başlatılıyor...';
    }, 900);
  </script>
</body>
</html>
